# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.soa.soausuarios=DEBUG

# Exponer el endpoint de health
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true

# Mostrar detalles del health check (opcional, pero útil)
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=true
# Forzar Swagger a usar JSON y evitar conflictos con XML
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.content-type=application/json
springdoc.writer-with-default-pretty-printer=true